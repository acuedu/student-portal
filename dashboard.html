<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System - ACU</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #000000;
            font-family: Tahoma, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
        }
        .sidebar {
            width: 130px;
            background-color: #0a0a0a;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px 5px;
            gap: 10px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 10px;
            color: #cccccc;
            text-decoration: none;
            padding: 4px;
            border-radius: 4px;
        }
        .menu-icon {
            width: 28px; height: 28px;
            margin-bottom: 3px;
            background-color: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .content-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .window-box {
            width: 100%;
            max-width: 550px;
            background-color: #e6e6e6;
            border: 2px solid #555555;
            border-radius: 6px;
            color: #000000;
            overflow: hidden;
        }
        .window-header {
            background: linear-gradient(to bottom, #4a6b9c, #2c4263);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .window-controls { display: flex; gap: 4px; }
        .win-btn {
            width: 14px; height: 14px;
            background-color: #ccc;
            border: 1px solid #888;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #000;
        }
        .window-body { padding: 15px; background-color: #f5f5f5; }
        .welcome-card {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .welcome-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .student-name { font-size: 14px; color: #003366; font-weight: bold; }
        .info-table {
            width: 100%; margin-top: 12px;
            border-collapse: collapse; font-size: 11px; text-align: right;
        }
        .info-table td { padding: 6px 4px; border-bottom: 1px solid #eee; }
        .info-label { font-weight: bold; color: #555; width: 35%; }
        .taskbar {
            height: 32px;
            background: linear-gradient(to bottom, #222, #111);
            border-top: 1px solid #444;
            display: flex; align-items: center; padding: 0 5px;
        }
        .start-btn {
            background: linear-gradient(to bottom, #3a689e, #1a385c);
            color: white;
            border: 1px solid #5a88be;
            padding: 3px 8px;
            font-size: 11px; font-weight: bold;
            border-radius: 3px; display: flex; align-items: center; gap: 4px;
        }
        .taskbar-tab {
            margin-right: 8px; background-color: #333; color: #fff;
            padding: 3px 10px; font-size: 10px; border-radius: 3px; border: 1px solid #555;
        }

        /* تعديلات خصيصاً لشاشات الموبايل */
        @media (max-width: 600px) {
            .sidebar { width: 80px; padding: 5px 2px; }
            .menu-item { font-size: 8px; }
            .content-area { padding: 5px; }
            .window-body { padding: 10px; }
            .info-table { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="menu-item"><div class="menu-icon">📝</div><div>التسجيل</div></div>
            <div class="menu-item"><div class="menu-icon">📅</div><div>الجدول</div></div>
            <div class="menu-item"><div class="menu-icon">📊</div><div>التقديرات</div></div>
            <div class="menu-item"><div class="menu-icon">👤</div><div>بياناتي</div></div>
            <div class="menu-item"><div class="menu-icon">🎓</div><div>التقرير</div></div>
            <div class="menu-item"><div class="menu-icon">⚠️</div><div>تنبيهات</div></div>
        </div>

        <div class="content-area">
            <div class="window-box">
                <div class="window-header">
                    <span>معلومات وتنبيهات</span>
                    <div class="window-controls">
                        <div class="win-btn">_</div>
                        <div class="win-btn">❐</div>
                        <div class="win-btn" onclick="location.href='index.html'">✕</div>
                    </div>
                </div>
                <div class="window-body">
                    <div class="welcome-card">
                        <div class="welcome-title">Welcome 👋</div>
                        <div class="student-name">رنا محمد عبدالله محمد</div>
                        
                        <table class="info-table">
                            <tr>
                                <td class="info-label">الكود الجامعي:</td>
                                <td>1252002</td>
                            </tr>
                            <tr>
                                <td class="info-label">الكلية:</td>
                                <td>الصيدلة / Pharmacy</td>
                            </tr>
                            <tr>
                                <td class="info-label">المستوى / الفصل:</td>
                                <td>المستوى الثالث - المستوى الرئيسي</td>
                            </tr>
                            <tr>
                                <td class="info-label">المعدل التراكمي (GPA):</td>
                                <td>3.42</td>
                            </tr>
                            <tr>
                                <td class="info-label">حالة التسجيل:</td>
                                <td style="color: green; font-weight: bold;">مسجل - منتظم</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-btn" onclick="location.href='index.html'">
            <span>🇪🇬</span> Start
        </button>
        <div class="taskbar-tab">معلومات وتنبيهات</div>
    </div>

</body>
</html>
