<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ACU</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; 
            background-color: #008080; font-family: Tahoma, Arial, sans-serif; 
            color: #000; overflow: hidden; display: flex; flex-direction: column;
        }

        .main-container { display: flex; flex: 1; height: calc(100vh - 30px); width: 100%; }

        /* القائمة الجانبية بالألوان القديمة */
        .sidebar { 
            width: 85px; background-color: #008080; border-left: 1px solid #004d4d; 
            display: flex; flex-direction: column; padding: 8px 2px; gap: 8px; overflow-y: auto; 
        }
        .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 9px; color: #fff; cursor: pointer; }
        .menu-icon { 
            width: 35px; height: 35px; margin-bottom: 3px; background-color: #fff; 
            border: 1px solid #000; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 16px; 
        }

        /* منطقة المنتصف */
        .content-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 15px; }

        /* النافذة بالألوان الكلاسيكية */
        .window-box { 
            width: 100%; max-width: 450px; background-color: #d4d0c8; 
            border: 2px outset #fff; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); padding: 2px;
        }
        .window-header { 
            background: linear-gradient(to right, #000080, #1084d0); color: white; 
            padding: 4px 8px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; 
        }
        .window-body { background-color: #ffffff; padding: 40px 20px; text-align: center; border: 1px inset #fff; }

        .welcome-title { font-size: 20px; font-weight: bold; color: #000; margin-bottom: 10px; }
        .student-name { font-size: 16px; color: #000080; font-weight: bold; }

        /* الشريط السفلي القديم */
        .taskbar { 
            height: 30px; background: #c0c0c0; border-top: 2px solid #fff; 
            display: flex; align-items: center; padding: 0 5px; 
        }
        .start-btn { 
            background: #c0c0c0; color: #000; border: 2px outset #fff; 
            padding: 2px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; 
        }
        .taskbar-tab { background: #d4d0c8; color: #000; padding: 2px 10px; font-size: 11px; margin-right: 8px; border: 2px inset #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="menu-item"><div class="menu-icon">📝</div><div>التسجيل</div></div>
            <div class="menu-item"><div class="menu-icon">📅</div><div>الجدول</div></div>
            <div class="menu-item"><div class="menu-icon">📊</div><div>التقديرات</div></div>
            <div class="menu-item"><div class="menu-icon">👤</div><div>بياناتي</div></div>
            <div class="menu-item"><div class="menu-icon">🎓</div><div>التقرير</div></div>
            <div class="menu-item"><div class="menu-icon">❓</div><div>الاستبيان</div></div>
            <div class="menu-item"><div class="menu-icon">💳</div><div>التقدير</div></div>
            <div class="menu-item"><div class="menu-icon">⚠️</div><div>تنبيهات</div></div>
        </div>

        <!-- النافذة تحتوي فقط على الترحيب والاسم بالألوان القديمة -->
        <div class="content-area">
            <div class="window-box">
                <div class="window-header">
                    <span>معلومات وتنبيهات</span>
                    <span style="cursor:pointer" onclick="location.href='index.html'">✕</span>
                </div>
                <div class="window-body">
                    <div class="welcome-title">👋 Welcome</div>
                    <div class="student-name">رنا محمد عبدالله محمد</div>
                </div>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="taskbar">
        <div class="start-btn" onclick="location.href='index.html'">🇪🇬 Start</div>
        <div class="taskbar-tab">معلومات وتنبيهات</div>
    </div>

</body>
</html>
