<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ACU</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; 
            background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; overflow: hidden; display: flex; flex-direction: column;
        }

        .main-container { display: flex; flex: 1; height: 100vh; width: 100%; }

        /* الشاشة الجانبية الداكنة */
        .sidebar { 
            width: 90px; background-color: #121212; border-left: 1px solid #222; 
            display: flex; flex-direction: column; padding: 12px 0; gap: 14px; overflow-y: auto; 
        }
        .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 11px; color: #a0a0a0; cursor: pointer; }
        .menu-icon { 
            width: 44px; height: 44px; margin-bottom: 4px; background-color: #1e1e1e; 
            border: 1px solid #2d2d2d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; 
        }

        /* منطقة المنتصف */
        .content-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 15px; }

        /* النافذة بالألوان المطبقة تماماً من الصورة */
        .window-box { 
            width: 100%; max-width: 420px; background-color: #2b3a55; 
            border: 1px solid #3b4e6d; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; padding: 2px;
        }
        
        /* شريط العنوان التدرج الكحلي */
        .window-header { 
            background: linear-gradient(to bottom, #355383, #223759); color: #ffffff; 
            padding: 8px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; 
        }
        
        /* أزرار النافذة اليسارية */
        .window-controls { display: flex; gap: 4px; }
        .win-btn { 
            width: 18px; height: 18px; background: #3b4e6d; color: #fff; border: 1px solid #52678a; 
            font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px;
        }

        /* الكارت الأبيض الداخلي بحواف دائرية */
        .window-body { 
            background-color: #ffffff; padding: 35px 20px; text-align: center; 
            border-radius: 8px; margin: 2px; border: 1px solid #dcdcdc;
        }

        .welcome-title { font-size: 22px; font-weight: bold; color: #222; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .student-name { font-size: 18px; color: #1c4172; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- النافذة بنفس مكان وألوان الصورة -->
        <div class="content-area">
            <div class="window-box">
                <div class="window-header">
                    <div class="window-controls">
                        <div class="win-btn" onclick="location.href='index.html'">✕</div>
                        <div class="win-btn">▢</div>
                        <div class="win-btn">-</div>
                    </div>
                    <span>معلومات وتنبيهات</span>
                </div>
                <div class="window-body">
                    <div class="welcome-title">👋 Welcome</div>
                    <div class="student-name">رنا محمد عبدالله محمد</div>
                </div>
            </div>
        </div>

        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="menu-item"><div class="menu-icon">📝</div><div>التسجيل</div></div>
            <div class="menu-item"><div class="menu-icon">📅</div><div>الجدول</div></div>
            <div class="menu-item"><div class="menu-icon">📊</div><div>التقديرات</div></div>
            <div class="menu-item"><div class="menu-icon">👤</div><div>بياناتي</div></div>
            <div class="menu-item"><div class="menu-icon">🎓</div><div>التقرير</div></div>
            <div class="menu-item"><div class="menu-icon">❓</div><div>الاستبيان</div></div>
            <div class="menu-item"><div class="menu-icon">💳</div><div>التقدير</div></div>
            <div class="menu-item"><div class="menu-icon">⚠️</div><div>تنبيهات</div></div>
        </div>
    </div>

</body>
</html>
