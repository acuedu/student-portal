<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ACU</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; 
            background-color: #000; font-family: Tahoma, Arial, sans-serif; 
            color: #000; overflow: hidden; display: flex; flex-direction: column;
        }

        .main-container { display: flex; flex: 1; height: calc(100vh - 30px); width: 100%; }

        /* القائمة الجانبية بالأسلوب القديم */
        .sidebar { 
            width: 85px; background-color: #111; border-left: 1px solid #333; 
            display: flex; flex-direction: column; padding: 8px 2px; gap: 8px; overflow-y: auto; 
        }
        .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 9px; color: #fff; cursor: pointer; }
        .menu-icon { 
            width: 36px; height: 36px; margin-bottom: 3px; background-color: #222; 
            border: 1px solid #444; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; 
        }

        /* توسيط النافذة في منتصف الشاشة تماماً */
        .content-area { 
            flex: 1; 
            display: flex; 
            align-items: center;     /* توسيط رأسي */
            justify-content: center; /* توسيط أفقي */
            padding: 15px; 
        }

        /* النافذة بالألوان الزرقاء والبيضاء القديمة */
        .window-box { 
            width: 100%; max-width: 420px; background-color: #ffffff; 
            border: 1px solid #0055cc; border-radius: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); overflow: hidden;
        }
        .window-header { 
            background: #0055cc; color: white; 
            padding: 8px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; 
        }
        .window-body { background-color: #ffffff; padding: 40px 20px; text-align: center; }

        .welcome-title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 12px; }
        .student-name { font-size: 18px; color: #0055cc; font-weight: bold; }

        /* الشريط السفلي */
        .taskbar { 
            height: 30px; background: #111; border-top: 1px solid #333; 
            display: flex; align-items: center; padding: 0 5px; 
        }
        .start-btn { 
            background: #222; color: #fff; border: 1px solid #444; 
            padding: 2px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; 
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="menu-item"><div class="menu-icon">📝</div><div>التسجيل</div></div>
            <div class="menu-item"><div class="menu-icon">📅</div><div>الجدول</div></div>
            <div class="menu-item"><div class="menu-icon">📊</div><div>التقديرات</div></div>
            <div class="menu-item"><div class="menu-icon">👤</div><div>بياناتي</div></div>
            <div class="menu-item"><div class="menu-icon">🎓</div><div>التقرير</div></div>
            <div class="menu-item"><div class="menu-icon">❓</div><div>الاستبيان</div></div>
            <div class="menu-item"><div class="menu-icon">💳</div><div>التقدير</div></div>
            <div class="menu-item"><div class="menu-icon">⚠️</div><div>تنبيهات</div></div>
        </div>

        <!-- النافذة في المنتصف تماماً -->
        <div class="content-area">
            <div class="window-box">
                <div class="window-header">
                    <span>معلومات وتنبيهات</span>
                    <span style="cursor:pointer" onclick="location.href='index.html'">✕</span>
                </div>
                <div class="window-body">
                    <div class="welcome-title">Welcome 👋</div>
                    <div class="student-name">رنا محمد عبدالله محمد</div>
                </div>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="taskbar">
        <div class="start-btn" onclick="location.href='index.html'">🇪🇬 Start</div>
    </div>

</body>
</html>
